<script>
const KEY = 'my-links-dashboard-v1';
const JSON_URL = 'links.json';

let links = [];

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const backdrop = document.getElementById('backdrop');
const form = document.getElementById('linkForm');

function saveLocal() {
  localStorage.setItem(KEY, JSON.stringify(links));
}

function domain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
}

function render() {
  const q = search.value.trim().toLowerCase();
  const filtered = links.filter(x => (x.name + ' ' + x.url + ' ' + (x.description || '')).toLowerCase().includes(q));
  document.getElementById('count').textContent = links.length + ' קישורים';

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">
      <div style="font-size:32px">🔎</div>
      <b>${q ? 'לא נמצאו תוצאות' : 'עדיין אין קישורים'}</b>
      ${q ? 'נסה לחפש מונח אחר.' : 'עדכן את links.json ב-GitHub או הוסף קישור.'}
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(x => {
    const i = links.indexOf(x);
    const host = domain(x.url);
    return `<article class="card">
      <div class="card-head">
        <div class="favicon">🌐</div>
        <div class="card-title">
          <h3>${esc(x.name)}</h3>
          <small>${esc(host)}</small>
        </div>
      </div>
      <p class="card-desc">${esc(x.description || ' ')}</p>
      <div class="card-actions">
        <a class="visit" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">פתח אתר ↗</a>
        <button class="delete" data-delete="${i}" aria-label="מחק ${esc(x.name)}">מחק קישור</button>
      </div>
    </article>`;
  }).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function open() {
  form.reset();
  backdrop.classList.add('show');
  document.getElementById('name').focus();
}

function close() {
  backdrop.classList.remove('show');
}

// ===== טעינה חזקה מ-JSON =====
async function loadFromJson(showToast = true) {
  try {
    // מונע cache בצורה חזקה
    const res = await fetch(JSON_URL + '?t=' + Date.now(), {
      cache: 'no-store'
    });

    if (!res.ok) {
      throw new Error(`שגיאה ${res.status} – הקובץ links.json לא נמצא`);
    }

    const data = await res.json();

    if (!Array.isArray(data)) {
      throw new Error('הקובץ links.json לא בפורמט מערך תקין');
    }

    links = data;
    saveLocal();          // מעדכן גם את הזיכרון המקומי
    render();

    if (showToast) toast('הקישורים עודכנו מ-links.json');
    console.log('נטען בהצלחה מ-links.json:', links.length, 'קישורים');

  } catch (err) {
    console.error('שגיאה בטעינת links.json:', err);

    // ניסיון fallback ל-localStorage
    try {
      const local = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(local) && local.length) {
        links = local;
        render();
        toast('לא הצלחתי לטעון את links.json – מציג גרסה מקומית');
      } else {
        links = [];
        render();
        toast('לא נמצא links.json ואין נתונים מקומיים');
      }
    } catch {
      links = [];
      render();
      toast('שגיאה בטעינת הקישורים');
    }
  }
}

// אירועים
document.getElementById('openModal').addEventListener('click', open);
document.getElementById('closeModal').addEventListener('click', close);
backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
search.addEventListener('input', render);

// כפתור רענון (אופציונלי – אפשר להוסיף אותו ל-toolbar)
// document.getElementById('refreshBtn')?.addEventListener('click', () => loadFromJson(true));

grid.addEventListener('click', e => {
  const btn = e.target.closest('[data-delete]');
  if (!btn) return;
  const i = Number(btn.dataset.delete);
  const name = links[i]?.name;
  if (!Number.isInteger(i) || !links[i]) return;
  if (confirm(`למחוק את הקישור "${name}"?`)) {
    links.splice(i, 1);
    saveLocal();
    render();
    toast('הקישור נמחק (רק מקומית)');
  }
});

form.addEventListener('submit', e => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  let url = document.getElementById('url').value.trim();
  const description = document.getElementById('description').value.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try {
    const parsed = new URL(url);
    if (!['http:', 'https:'].includes(parsed.protocol)) throw 0;
    url = parsed.href;
  } catch {
    toast('נא להזין כתובת אתר תקינה');
    return;
  }
  links.unshift({ name, url, description });
  saveLocal();
  render();
  close();
  toast('הקישור נוסף (רק מקומית)');
});

// התחלה
loadFromJson(false);
</script>
